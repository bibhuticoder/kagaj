<!doctype html>
<html lang="ne">
  <head>
    <meta charset="UTF-8" />
    <title>कागज | Kagaj - Nepali Notepad</title>
    
    <!-- Viewport & Mobile Scaling -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover"
    />
    <meta name="description" content="Kagaj - Minimalist, ad-free Nepali transliteration notepad with Bikram Sambat calendar." />
    
    <!-- Theme & Status Bar Colors -->
    <meta name="theme-color" content="#212121" />

    <!-- iOS Web App / Add to Homescreen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="कागज" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Android & Web App Manifest -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="कागज" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />
    
    <!-- Preconnect & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
